# CI: テスト + ビルド + Edge Function 同期チェック
# 金額計算等の規約テスト (src/utils/*.test.js) が落ちる push を検知する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Edge Function 同期チェックで git log を使うため全履歴取得

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: テスト (vitest)
        run: npm test

      - name: ビルド
        run: npm run build

      # GitHub Secrets に SUPABASE_ACCESS_TOKEN を設定すると有効化される。
      # 未設定の場合はスクリプト側でスキップ（exit 0）する。
      - name: Edge Function 同期チェック
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-edge-functions.mjs

  deploy-homepage-lookup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-homepage-lookup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: 検証済みHP検索・録音処理・企業ドシエを本番反映
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo '新しいmainがあるため古い関数の反映をスキップします'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          for (const name of ['lookup-company-homepage', 'r2', 'transcribe-recording', 'generate-company-dossier']) {
            const result = spawnSync('supabase', ['functions', 'deploy', name, '--project-ref', 'baiiznjzvzhxwwqzsozn', '--use-api'], {
              stdio: 'inherit',
              env: { ...process.env, SUPABASE_ACCESS_TOKEN: (process.env.SUPABASE_ACCESS_TOKEN || '').trim() },
            });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
