<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spanavi</title>
    <meta name="description" content="架電管理SaaS — 架電・アポ管理・録音・スクリプトを一元管理" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="theme-color" content="#0D2247" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="256x256" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-navy-dark text-white font-sans" style="margin:0;background:#0D2247">
    <div id="root">
      <style>
        /* 読み込み C「鼓動」：盾が脈打ち、中心から波紋が広がる（ShieldMark.css と同じ動き）。文字は出さない */
        .splash-root{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1456C7 0%,#1E3A8A 30%,#0D2247 60%,#081636 100%)}
        .splash-mark{position:relative;width:72px;height:83px}
        .splash-mark svg{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;animation:splashBeat 1.4s cubic-bezier(.2,.8,.2,1) infinite}
        .splash-mark i{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;border:1.5px solid #7DB8F0;opacity:0;animation:splashWave 2.1s cubic-bezier(.2,.8,.2,1) infinite}
        .splash-mark i:nth-child(2){animation-delay:.7s}.splash-mark i:nth-child(3){animation-delay:1.4s}
        @keyframes splashBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(.99)}36%{transform:scale(1.03)}}
        @keyframes splashWave{0%{transform:scale(.35);opacity:.9}100%{transform:scale(2.6);opacity:0}}
        @media (prefers-reduced-motion:reduce){.splash-mark svg,.splash-mark i{animation:none}}
      </style>
      <div class="splash-root" role="status" aria-label="読み込み中">
        <div class="splash-mark">
          <i></i><i></i><i></i>
          <!-- SpanaviLogo と同じ盾（中心 26,30・太線8本＋細線8本） -->
          <svg viewBox="0 0 52 60" aria-hidden="true">
            <defs>
              <linearGradient id="spSplash" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#0176D3"/><stop offset="100%" stop-color="#032D60"/></linearGradient>
              <clipPath id="spSplashClip"><path d="M26 3 L5 12 L5 34 Q5 52 26 58 Q47 52 47 34 L47 12 Z"/></clipPath>
            </defs>
            <path d="M26 3 L5 12 L5 34 Q5 52 26 58 Q47 52 47 34 L47 12 Z" fill="url(#spSplash)"/>
            <g clip-path="url(#spSplashClip)" stroke="white" fill="none">
              <g opacity="0.45" stroke-width="1.2">
                <line x1="26" y1="30" x2="26" y2="-5"/><line x1="26" y1="30" x2="55" y2="30"/><line x1="26" y1="30" x2="26" y2="65"/><line x1="26" y1="30" x2="-3" y2="30"/>
                <line x1="26" y1="30" x2="47" y2="5"/><line x1="26" y1="30" x2="47" y2="55"/><line x1="26" y1="30" x2="5" y2="55"/><line x1="26" y1="30" x2="5" y2="5"/>
              </g>
              <g opacity="0.30" stroke-width="0.8">
                <line x1="26" y1="30" x2="37" y2="-2"/><line x1="26" y1="30" x2="53" y2="16"/><line x1="26" y1="30" x2="53" y2="44"/><line x1="26" y1="30" x2="37" y2="62"/>
                <line x1="26" y1="30" x2="15" y2="62"/><line x1="26" y1="30" x2="-1" y2="44"/><line x1="26" y1="30" x2="-1" y2="16"/><line x1="26" y1="30" x2="15" y2="-2"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
